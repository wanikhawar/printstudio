[project]
name = "printstudio"
version = "0.1.0"
description = "One print dialog for every app: reverse order, collate, n-up, manual two-sided and every printer option."
requires-python = ">=3.11"
# Installed from the distro (pacman -S pyside6 python-pypdf python-pycups python-pillow);
# install.sh runs straight from src/ against the system Python.
dependencies = ["PySide6>=6.5", "pypdf>=4", "pycups>=2", "Pillow>=10"]

[project.scripts]
printstudio-watch = "printstudio.watch:main"

[project.gui-scripts]
printstudio = "printstudio.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
